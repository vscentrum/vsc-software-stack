[build-system]
requires = ["ase", "atomistics", "defusedxml", "h5py", "matplotlib", "mendeleev", "mp-api", "numpy", "pandas", "phonopy", "pint", "pyiron_base", "pylammpsmpi", "scipy", "scikit-learn", "seekpath", "setuptools", "spglib", "structuretoolkit", "hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyiron_atomistics"
description = "An interface to atomistic simulation codes including but not limited to GPAW, LAMMPS, S/Phi/nX and VASP."
authors = [
    { name = "Max-Planck-Institut für Eisenforschung GmbH - Computational Materials Design (CM) Department", email = "pyiron@mpie.de" },
]
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["pyiron"]
requires-python = ">=3.9, <3.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ase",
    "atomistics",
    "defusedxml",
    "h5py",
    "matplotlib",
    "mendeleev",
    "mp-api",
    "numpy",
    "pandas",
    "phonopy",
    "pint",
    "pyiron_base",
    "pyiron_lammps",
    "pyiron_snippets",
    "pyiron_vasp",
    "pylammpsmpi",
    "pyscal3",
    "scipy",
    "scikit-learn",
    "seekpath",
    "spglib",
    "structuretoolkit",
    "sphinx-parser",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://pyiron.org"
Documentation = "https://pyiron.readthedocs.io"
Repository = "https://github.com/pyiron/pyiron_atomistics"

[tool.hatch.build]
include = [
    "pyiron_atomistics"
]

[tool.hatch.build.hooks.vcs]
version-file = "pyiron_atomistics/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "pyiron_atomistics"
]

[tool.hatch.build.targets.wheel]
packages = [
    "pyiron_atomistics"
]

[tool.hatch.version]
source = "vcs"
path = "pyiron_atomistics/_version.py"

[tool.coverage.run]
omit = ["pyiron_atomistics/_version.py", "tests/*"]
command_line = "-m unittest discover tests"
